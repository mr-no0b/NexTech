<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin – Products')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex" style="min-height:calc(100vh - 70px)">
  <div class="dash-sidebar d-none d-lg-block" style="width:240px;flex-shrink:0;">
    <nav class="nav flex-column mt-3">
      <a class="nav-link" th:href="@{/admin/dashboard}"><i class="fa fa-gauge me-2"></i>Dashboard</a>
      <a class="nav-link active" th:href="@{/admin/products}"><i class="fa fa-box me-2"></i>Product Approvals</a>
      <a class="nav-link" th:href="@{/admin/users}"><i class="fa fa-users me-2"></i>Users</a>
      <a class="nav-link" th:href="@{/admin/orders}"><i class="fa fa-bag-shopping me-2"></i>Orders</a>
    </nav>
  </div>

  <div class="dash-content flex-grow-1">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h2 class="fw-800 mb-1">Product Approvals</h2>
        <p style="color:var(--text-muted)">Review and approve seller product listings</p>
      </div>
    </div>

    <!-- Status tabs -->
    <div class="d-flex gap-2 mb-4 flex-wrap">
      <a th:href="@{/admin/products?status=PENDING}"
         class="btn-nextech btn-nextech-sm"
         th:classappend="${currentStatus == 'PENDING'} ? ' btn-nextech-primary' : ' btn-nextech-outline'">
        <i class="fa fa-clock"></i> Pending
      </a>
      <a th:href="@{/admin/products?status=APPROVED}"
         class="btn-nextech btn-nextech-sm"
         th:classappend="${currentStatus == 'APPROVED'} ? ' btn-nextech-success' : ' btn-nextech-outline'">
        <i class="fa fa-check"></i> Approved
      </a>
      <a th:href="@{/admin/products?status=REJECTED}"
         class="btn-nextech btn-nextech-sm"
         th:classappend="${currentStatus == 'REJECTED'} ? ' btn-nextech-danger' : ' btn-nextech-outline'">
        <i class="fa fa-xmark"></i> Rejected
      </a>
    </div>

    <!-- Product table -->
    <div class="rounded-nextech border-nextech overflow-hidden"
         th:if="${not #lists.isEmpty(products)}">
      <table class="table table-nextech mb-0">
        <thead>
          <tr>
            <th>Product</th>
            <th>Seller</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${products}">
            <td>
              <div style="font-weight:600;max-width:180px" th:text="${p.name}"></div>
              <div style="font-size:.75rem;color:var(--text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                   th:text="${p.description}"></div>
            </td>
            <td>
              <div style="font-weight:500" th:text="${p.seller.shopName ?: p.seller.username}"></div>
              <div style="font-size:.75rem;color:var(--text-muted)" th:text="${p.seller.email}"></div>
            </td>
            <td><span class="badge-nextech badge-blue" th:text="${p.category.name}"></span></td>
            <td style="font-weight:700;color:var(--accent-blue)"
                th:text="'$' + ${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')}"></td>
            <td th:text="${p.stock}"></td>
            <td>
              <span class="badge-nextech"
                    th:classappend="${p.status.name() == 'PENDING'} ? ' badge-pending' : (${p.status.name() == 'APPROVED'} ? ' badge-approved' : ' badge-rejected')"
                    th:text="${p.status}">
              </span>
            </td>
            <td>
              <div class="d-flex gap-1 flex-wrap">
                <!-- Approve (shown for PENDING/REJECTED) -->
                <form th:if="${p.status.name() != 'APPROVED'}"
                      th:action="@{/admin/products/{id}/approve(id=${p.id})}" method="post">
                  <button type="submit" class="btn-nextech btn-nextech-success btn-nextech-sm"
                          title="Approve">
                    <i class="fa fa-check"></i>
                  </button>
                </form>
                <!-- Reject with reason modal trigger -->
                <button th:if="${p.status.name() != 'REJECTED'}"
                        class="btn-nextech btn-nextech-danger btn-nextech-sm"
                        title="Reject"
                        th:onclick="'openRejectModal(' + ${p.id} + ')'">
                  <i class="fa fa-ban"></i>
                </button>
                <!-- Delete -->
                <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Permanently delete this product?')">
                  <button type="submit" class="btn-nextech btn-nextech-sm"
                          style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.3);"
                          title="Delete">
                    <i class="fa fa-trash"></i>
                  </button>
                </form>
              </div>
              <!-- Show rejection reason if rejected -->
              <div th:if="${p.rejectionReason != null}"
                   style="font-size:.72rem;color:var(--danger);margin-top:4px;max-width:160px"
                   th:text="'Reason: ' + ${p.rejectionReason}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
      <i class="fa fa-inbox fa-2x mb-3" style="color:var(--text-muted)"></i>
      <p style="color:var(--text-muted)">No products found in this category.</p>
    </div>
  </div>
</div>

<!-- Reject Modal -->
<div id="rejectModal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:2rem;max-width:420px;width:90%;">
    <h5 class="fw-700 mb-3">Reject Product</h5>
    <form id="rejectForm" method="post">
      <div class="form-nextech mb-3">
        <label class="form-label">Rejection Reason</label>
        <textarea name="reason" class="form-control" rows="3"
                  placeholder="Explain why the product is rejected..."></textarea>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="btn-nextech btn-nextech-outline"
                onclick="closeRejectModal()">Cancel</button>
        <button type="submit" class="btn-nextech btn-nextech-danger">Reject</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function openRejectModal(id) {
  document.getElementById('rejectForm').action = '/admin/products/' + id + '/reject';
  document.getElementById('rejectModal').style.display = 'flex';
}
function closeRejectModal() {
  document.getElementById('rejectModal').style.display = 'none';
}
</script>
</body>
</html>
