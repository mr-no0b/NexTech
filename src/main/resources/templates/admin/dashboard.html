<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex" style="min-height:calc(100vh - 70px)">
  <!-- Sidebar -->
  <div class="dash-sidebar d-none d-lg-block" style="width:240px;flex-shrink:0;">
    <div class="px-4 mb-3">
      <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);font-weight:600;">
        Admin Panel
      </div>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link active" th:href="@{/admin/dashboard}">
        <i class="fa fa-gauge w-5"></i> Dashboard
      </a>
      <a class="nav-link" th:href="@{/admin/products?status=PENDING}">
        <i class="fa fa-box w-5"></i> Product Approvals
        <span class="badge-nextech badge-pending ms-auto" style="font-size:.68rem"
              th:text="${pendingProducts}">0</span>
      </a>
      <a class="nav-link" th:href="@{/admin/users}">
        <i class="fa fa-users w-5"></i> Users
      </a>
      <a class="nav-link" th:href="@{/admin/orders}">
        <i class="fa fa-bag-shopping w-5"></i> Orders
      </a>
    </nav>
  </div>

  <!-- Content -->
  <div class="dash-content flex-grow-1">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="mb-4">
      <h2 class="fw-800 mb-1">Dashboard</h2>
      <p style="color:var(--text-muted)">Welcome back, Administrator.</p>
    </div>

    <!-- Stats row -->
    <div class="row g-4 mb-5">
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card blue">
          <div class="stat-icon text-accent-blue"><i class="fa fa-box-open"></i></div>
          <div class="stat-value" th:text="${totalProducts}">0</div>
          <div class="stat-name">Approved Products</div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card orange">
          <div class="stat-icon text-warning-nextech"><i class="fa fa-clock"></i></div>
          <div class="stat-value" th:text="${pendingProducts}">0</div>
          <div class="stat-name">Pending Approval</div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card cyan">
          <div class="stat-icon text-accent-cyan"><i class="fa fa-users"></i></div>
          <div class="stat-value" th:text="${totalUsers}">0</div>
          <div class="stat-name">Registered Users</div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stat-card green">
          <div class="stat-icon text-success-nextech"><i class="fa fa-bag-shopping"></i></div>
          <div class="stat-value" th:text="${totalOrders}">0</div>
          <div class="stat-name">Total Orders</div>
        </div>
      </div>
    </div>

    <!-- Pending products quick-action table -->
    <div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-700 mb-0">
          <span class="badge-nextech badge-pending me-2" th:text="${pendingList.size()}">0</span>
          Awaiting Approval
        </h4>
        <a th:href="@{/admin/products?status=PENDING}"
           class="btn-nextech btn-nextech-outline btn-nextech-sm">View All</a>
      </div>

      <div class="rounded-nextech border-nextech overflow-hidden"
           th:if="${not #lists.isEmpty(pendingList)}">
        <table class="table table-nextech mb-0">
          <thead>
            <tr>
              <th>Product</th><th>Seller</th><th>Category</th><th>Price</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pendingList}">
              <td>
                <div style="font-weight:600" th:text="${p.name}"></div>
                <div style="font-size:.78rem;color:var(--text-muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                     th:text="${p.description}"></div>
              </td>
              <td>
                <div th:text="${p.seller.shopName ?: p.seller.username}"></div>
                <div style="font-size:.75rem;color:var(--text-muted)" th:text="${p.seller.email}"></div>
              </td>
              <td><span class="badge-nextech badge-blue" th:text="${p.category.name}"></span></td>
              <td style="font-weight:700;color:var(--accent-blue)"
                  th:text="'$' + ${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')}"></td>
              <td>
                <div class="d-flex gap-1">
                  <form th:action="@{/admin/products/{id}/approve(id=${p.id})}" method="post">
                    <button type="submit" class="btn-nextech btn-nextech-success btn-nextech-sm">
                      <i class="fa fa-check"></i>
                    </button>
                  </form>
                  <form th:action="@{/admin/products/{id}/reject(id=${p.id})}" method="post"
                        onsubmit="return confirm('Reject this product?')">
                    <button type="submit" class="btn-nextech btn-nextech-danger btn-nextech-sm">
                      <i class="fa fa-xmark"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${#lists.isEmpty(pendingList)}" class="text-center py-5">
        <i class="fa fa-circle-check fa-2x mb-3" style="color:var(--success)"></i>
        <p style="color:var(--text-muted)">All caught up! No products pending approval.</p>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
