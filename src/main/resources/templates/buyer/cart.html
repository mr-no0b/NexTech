<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Cart')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
  <h2 class="fw-800 mb-4"><i class="fa fa-cart-shopping text-accent-blue me-2"></i>My Cart</h2>

  <!-- Empty cart -->
  <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="text-center py-5">
    <i class="fa fa-cart-shopping fa-4x mb-3" style="color:var(--text-muted)"></i>
    <h4 style="color:var(--text-secondary)">Your cart is empty</h4>
    <p style="color:var(--text-muted)">Add some products to get started.</p>
    <a th:href="@{/products}" class="btn-nextech btn-nextech-primary mt-2">
      <i class="fa fa-store"></i> Browse Products
    </a>
  </div>

  <!-- Cart with items -->
  <div th:if="${cart != null and not #lists.isEmpty(cart.items)}" class="row g-4">

    <!-- Items list -->
    <div class="col-lg-8">
      <div class="rounded-nextech border-nextech overflow-hidden">
        <div th:each="item : ${cart.items}" class="cart-item d-flex align-items-center gap-3">
          <!-- Image / Placeholder -->
          <div style="width:80px;height:80px;flex-shrink:0;border-radius:10px;overflow:hidden;
                      background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
            <img th:if="${item.product.imageUrl != null and not #strings.isEmpty(item.product.imageUrl)}"
                 th:src="${item.product.imageUrl}" alt="Product"
                 style="width:100%;height:100%;object-fit:cover;" />
            <i th:unless="${item.product.imageUrl != null and not #strings.isEmpty(item.product.imageUrl)}"
               class="fa fa-microchip fa-2x" style="color:var(--text-muted)"></i>
          </div>

          <!-- Info -->
          <div class="flex-grow-1">
            <div style="font-weight:700" th:text="${item.product.name}"></div>
            <div style="font-size:.8rem;color:var(--text-muted)" th:text="${item.product.category.name}"></div>
            <div style="color:var(--accent-blue);font-weight:600;margin-top:.3rem"
                 th:text="'$' + ${#numbers.formatDecimal(item.product.price,1,'COMMA',2,'POINT')}"></div>
          </div>

          <!-- Quantity form -->
          <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-2">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
            <input type="hidden" name="cartItemId" th:value="${item.id}"/>
            <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                   th:max="${item.product.stock}"
                   class="form-control text-center"
                   style="width:70px;background:var(--surface-2);border-color:var(--border-color);color:var(--text-primary);"
                   onchange="this.form.submit()"/>
          </form>

          <!-- Subtotal -->
          <div style="width:90px;text-align:right;font-weight:700;color:var(--success)"
               th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity,1,'COMMA',2,'POINT')}">
          </div>

          <!-- Remove -->
          <form th:action="@{/cart/remove}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
            <input type="hidden" name="cartItemId" th:value="${item.id}"/>
            <button type="submit" class="btn btn-sm"
                    style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:8px;"
                    title="Remove">
              <i class="fa fa-trash"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Continue shopping -->
      <a th:href="@{/products}" class="btn-nextech btn-nextech-outline mt-3 d-inline-flex">
        <i class="fa fa-arrow-left"></i> Continue Shopping
      </a>
    </div>

    <!-- Checkout sidebar -->
    <div class="col-lg-4">
      <div class="rounded-nextech border-nextech p-4" style="position:sticky;top:90px;">
        <h5 class="fw-700 mb-3">Order Summary</h5>

        <!-- Item breakdown -->
        <div th:each="item : ${cart.items}" class="d-flex justify-content-between mb-2"
             style="font-size:.85rem;color:var(--text-secondary)">
          <span th:text="${item.product.name} + ' × ' + ${item.quantity}"></span>
          <span th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity,1,'COMMA',2,'POINT')}"></span>
        </div>

        <hr style="border-color:var(--border-color);margin:1rem 0;"/>

        <div class="d-flex justify-content-between mb-4" style="font-weight:700;font-size:1.1rem;">
          <span>Total</span>
          <span style="color:var(--accent-blue)"
                th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <!-- Checkout form -->
        <form th:action="@{/cart/checkout}" method="post" th:object="${checkoutDto}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label" style="color:var(--text-secondary);font-size:.85rem;">
              Shipping Address *
            </label>
            <textarea th:field="*{shippingAddress}" rows="3"
                      class="form-control"
                      style="background:var(--surface-2);border-color:var(--border-color);color:var(--text-primary);resize:none;"
                      placeholder="Enter your full shipping address…"
                      th:classappend="${#fields.hasErrors('shippingAddress')} ? ' is-invalid' : ''"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('shippingAddress')}"
                 th:errors="*{shippingAddress}"></div>
          </div>
          <button type="submit" class="btn-nextech btn-nextech-primary w-100">
            <i class="fa fa-lock me-2"></i>Place Order
          </button>
        </form>
      </div>
    </div>

  </div><!-- /row -->
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
