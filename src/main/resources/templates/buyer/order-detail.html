<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5" style="max-width:860px">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a th:href="@{/buyer/orders}" class="btn-nextech btn-nextech-outline py-1" style="font-size:.82rem;">
      <i class="fa fa-arrow-left"></i> Back
    </a>
    <h2 class="fw-800 mb-0">
      Order <span style="color:var(--accent-blue)" th:text="'#' + ${order.id}"></span>
    </h2>
    <span class="badge-nextech ms-auto"
          th:classappend="${order.status.name() == 'PENDING'}    ? ' badge-pending'
                       : (${order.status.name() == 'CONFIRMED'}  ? ' badge-blue'
                       : (${order.status.name() == 'SHIPPED'}    ? ' badge-blue'
                       : (${order.status.name() == 'DELIVERED'}  ? ' badge-approved'
                       : ' badge-rejected')))"
          th:text="${order.status}">
    </span>
  </div>

  <div class="row g-4">
    <!-- Items table -->
    <div class="col-md-8">
      <div class="rounded-nextech border-nextech overflow-hidden mb-4">
        <div class="px-4 py-3" style="border-bottom:1px solid var(--border-color);">
          <span style="font-weight:700">Order Items</span>
        </div>
        <table class="table table-nextech mb-0">
          <thead>
            <tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr>
          </thead>
          <tbody>
            <tr th:each="item : ${order.items}">
              <td>
                <div style="font-weight:600" th:text="${item.product.name}"></div>
                <div style="font-size:.78rem;color:var(--text-muted)" th:text="${item.product.category.name}"></div>
              </td>
              <td th:text="${item.quantity}"></td>
              <td th:text="'$' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')}"></td>
              <td style="font-weight:700;color:var(--success)"
                  th:text="'$' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',2,'POINT')}"></td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="text-end" style="font-weight:700;">Total</td>
              <td style="font-weight:800;font-size:1.05rem;color:var(--accent-blue)"
                  th:text="'$' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- Info sidebar -->
    <div class="col-md-4">
      <div class="rounded-nextech border-nextech p-4 mb-3">
        <div class="fw-700 mb-3">Order Information</div>
        <div class="d-flex flex-column gap-2" style="font-size:.88rem;">
          <div>
            <span style="color:var(--text-muted)">Order Date:</span>
            <br/>
            <span th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, HH:mm')}"></span>
          </div>
          <div>
            <span style="color:var(--text-muted)">Status:</span>
            <br/>
            <span style="font-weight:700" th:text="${order.status}"></span>
          </div>
          <div>
            <span style="color:var(--text-muted)">Total Amount:</span>
            <br/>
            <span style="font-weight:700;color:var(--success)"
                  th:text="'$' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></span>
          </div>
        </div>
      </div>
      <div class="rounded-nextech border-nextech p-4">
        <div class="fw-700 mb-2">Shipping Address</div>
        <p style="font-size:.88rem;color:var(--text-secondary);white-space:pre-wrap;margin:0"
           th:text="${order.shippingAddress}"></p>
      </div>
    </div>
  </div><!-- /row -->
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
