# Datasource - override with environment variables in Docker/Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextech_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nextech}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nextech123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# Server
server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.nextech=INFO
logging.level.org.springframework.security=WARN
